<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEE6F8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Thought Trash"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>html{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}</style>
<title>Thought Trash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;800&family=Playfair+Display:wght@700;900&family=Space+Mono:wght@700&display=swap">
<style>
/* 한 화면 앱: 깔끔한 파스텔 배경 위에 서리 낀 유리 쓰레기통. 메모는 찢은 자국이 있는 실제 종이이고, 던지면 접힌 자국이 생기며 구겨져 통으로 들어간다. */
:root{
  --bg1:#EEE6F8; --bg2:#FCE7DB; --blob-a:#BFEBDD; --blob-b:#F9C3D4; --blob-c:#BFD6FF; --blob-d:#FFE7A3;
  --fg:#2A2540; --muted:#6F6890;
  --glass-edge:rgba(255,255,255,.85); --glass-fill:rgba(255,255,255,.46); --glass-line:rgba(255,255,255,.75);
  --body-hi:rgba(255,255,255,.62); --body-mid:rgba(255,255,255,.2); --body-lo:rgba(255,255,255,.34); --body-tint:rgba(184,172,232,.26);
  --shadow:rgba(70,50,120,.26);
  --btn:#2A2540; --btn-fg:#FFFFFF;
  --ink:#2A2530; --ink-soft:#8A8294; --paper-shadow:rgba(60,40,100,.32);
  --focus:#2F6FED;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1B1730; --bg2:#2A1B2A; --blob-a:#2E6B5C; --blob-b:#8A3A5E; --blob-c:#3A4F9A; --blob-d:#8A6B1E;
    --fg:#F1ECFF; --muted:#B3AAD6;
    --glass-fill:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.4);
    --body-hi:rgba(255,255,255,.34); --body-mid:rgba(255,255,255,.08); --body-lo:rgba(255,255,255,.18); --body-tint:rgba(150,140,220,.18);
    --shadow:rgba(0,0,0,.5);
    --btn:#F1ECFF; --btn-fg:#1B1730; --paper-shadow:rgba(0,0,0,.6); --focus:#7FA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#1B1730; --bg2:#2A1B2A; --blob-a:#2E6B5C; --blob-b:#8A3A5E; --blob-c:#3A4F9A; --blob-d:#8A6B1E;
  --fg:#F1ECFF; --muted:#B3AAD6; --glass-fill:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.4);
  --body-hi:rgba(255,255,255,.34); --body-mid:rgba(255,255,255,.08); --body-lo:rgba(255,255,255,.18); --body-tint:rgba(150,140,220,.18);
  --shadow:rgba(0,0,0,.5); --btn:#F1ECFF; --btn-fg:#1B1730; --paper-shadow:rgba(0,0,0,.6); --focus:#7FA8FF; color-scheme:dark;
}

html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg1);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* 배경: 깔끔한 파스텔 그라데이션과 은은한 색 번짐 (유리가 이 색을 비춰 보이게 한다) */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.75}
.blob.a{width:60vw;height:60vw;left:-20vw;top:38%;background:var(--blob-a)}
.blob.b{width:70vw;height:70vw;right:-26vw;top:8%;background:var(--blob-b)}
.blob.c{width:62vw;height:62vw;left:19vw;top:46%;background:var(--blob-c)}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:24px 22px}
.app h1{margin:0;font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1.2;transition:opacity .2s}
.app.open h1{opacity:0}
.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}

/* 유리 통: 뒤(안쪽 벽·종이 더미) → 날아가는 종이 → 앞(서리 낀 유리) 순서 */
.bin{position:relative;width:min(80vw,330px,calc(48dvh * 260 / 300));aspect-ratio:260/300}
.bpart{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 94%}
.bpart.back{z-index:1}
.glass{inset:auto;left:0;top:23.333%;height:75.333%;z-index:3;
  -webkit-clip-path:url(#binClip);clip-path:url(#binClip);
  -webkit-backdrop-filter:blur(15px) saturate(1.7) brightness(1.07);backdrop-filter:blur(15px) saturate(1.7) brightness(1.07);
  background:
    linear-gradient(to bottom,rgba(255,255,255,0) 55%,var(--body-tint)),
    linear-gradient(100deg,var(--body-hi) 0%,var(--body-mid) 30%,var(--body-mid) 58%,var(--body-lo) 100%)}
.bpart.front{z-index:4;pointer-events:none}
.g-line{fill:none;stroke:var(--glass-line);stroke-width:1.6;stroke-linejoin:round}
.g-rim{fill:none;stroke:var(--glass-edge);stroke-width:2.6}
.g-soft{filter:url(#soft)}

.fab{position:absolute;z-index:5;left:50%;top:61%;width:68px;height:68px;margin:0;padding:0;border-radius:50%;
  display:grid;place-items:center;color:var(--fg);cursor:pointer;touch-action:manipulation;
  background:rgba(255,255,255,.46);border:1.5px solid rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5);
  transform:translate(-50%,-50%);box-shadow:0 10px 22px var(--shadow),inset 0 1px 0 rgba(255,255,255,.95);
  transition:transform .15s ease}
.fab:active{transform:translate(-50%,-50%) scale(.94)}
.fab svg{width:28px;height:28px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.fab.is-open svg{transform:rotate(45deg)}
.fab:disabled{cursor:default}

.pill{margin:0;padding:10px 18px;border-radius:999px;background:var(--glass-fill);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 6px 16px var(--shadow)}
.status{font-size:15px;line-height:1.4;text-align:center;text-wrap:balance;font-weight:500;max-width:min(88vw,360px)}
.tally{margin:-6px 0 0;padding:5px 12px;min-height:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally:empty{display:none}

/* 메모 카드: 윗면을 찢은 실제 종이 + 테이프 */
.card{position:fixed;z-index:10;left:0;right:0;margin-inline:auto;isolation:isolate;width:min(calc(100% - 32px),420px);
  top:calc(var(--vvt,0px) + env(safe-area-inset-top,0px) + 14px);
  height:min(370px,calc(var(--vvh,100dvh) - env(safe-area-inset-top,0px) - 26px));
  display:flex;flex-direction:column;gap:10px;padding:34px 26px 16px;color:var(--ink);
  opacity:0;pointer-events:none;transform:translateY(-14px) rotate(-1.6deg) scale(.97);
  transition:opacity .2s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
.card.open{opacity:1;pointer-events:auto;transform:rotate(-.6deg)}
.card.snap{transition:none}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--paper-img,#F7F3E8) center/100% 100% no-repeat;
  filter:drop-shadow(0 20px 24px var(--paper-shadow)) drop-shadow(0 2px 3px rgba(60,40,100,.25))}
.card::after{content:"";position:absolute;left:50%;top:-9px;width:86px;height:26px;margin-left:-43px;transform:rotate(-3deg);opacity:.86;
  background:linear-gradient(rgba(255,244,180,.82),rgba(255,234,146,.74));box-shadow:0 1px 3px rgba(60,40,100,.22);
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 92%)}
.note{flex:1;min-height:0;width:100%;margin:0;padding:0;border:0;outline:0;resize:none;background:transparent;
  color:var(--ink);caret-color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
.note::placeholder{color:var(--ink-soft)}
.card-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px}
.card-foot small{font-size:12.5px;color:var(--ink-soft)}
.toss{min-height:46px;padding:0 26px;border:0;border-radius:23px;background:var(--btn);color:var(--btn-fg);
  font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 10px rgba(42,37,64,.3);transition:opacity .15s,transform .15s}
.toss:active{transform:scale(.96)}
.toss:disabled{opacity:.3;cursor:default}

/* 날아가는 종이 */
.paper{position:fixed;z-index:2;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(0 8px 10px rgba(60,40,100,.28))}
.sheet{position:absolute;inset:0;background:var(--paper-img,#F7F3E8) center/100% 100% no-repeat;overflow:hidden}
.ptxt{position:absolute;inset:0;padding:34px 26px 16px;box-sizing:border-box;overflow:hidden;font-family:var(--font);font-size:18px;line-height:1.6;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.fold{position:absolute;inset:0;opacity:0;background:var(--crease-img) center/100% 100% no-repeat}
.ballimg{position:absolute;opacity:0;background-size:100% 100%;background-repeat:no-repeat}

@media (prefers-reduced-motion: reduce){
  .card,.fab,.fab svg,.toss{transition:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <clipPath id="binClip" clipPathUnits="objectBoundingBox">
    <path d="M0.0462,0 C0.0462,0.0487 0.25,0.0885 0.5,0.0885 C0.75,0.0885 0.9538,0.0487 0.9538,0 L0.8308,0.8938 Q0.8192,1 0.7308,1 L0.2692,1 Q0.1808,1 0.1692,0.8938 Z"/>
  </clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</svg>

<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
</div>

<main class="app" id="app">
  <h1>Thought Trash</h1>

  <section class="stage">
    <div class="bin" id="bin">
      <svg class="bpart back" viewBox="0 0 260 300" aria-hidden="true">
        <ellipse cx="130" cy="298" rx="104" ry="9" fill="var(--shadow)" class="g-soft"/>
        <ellipse cx="130" cy="70" rx="118" ry="20" fill="rgba(255,255,255,.3)" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
        <ellipse id="mouth" cx="130" cy="68" rx="110" ry="16" fill="rgba(196,190,224,.55)"/>
        <g id="pile"></g>
      </svg>

      <div class="bpart glass" aria-hidden="true"></div>

      <svg class="bpart front" viewBox="0 0 260 300" aria-hidden="true">
        <path class="g-line" d="M12 70 C12 81 65 90 130 90 C195 90 248 81 248 70 L216 272 Q213 296 190 296 L70 296 Q47 296 44 272 Z"/>
        <path class="g-rim" d="M12 70 C12 81 65 90 130 90 C195 90 248 81 248 70"/>
        <path class="g-line" style="opacity:.5" d="M19 72 C19 83 68 93 130 93 C192 93 241 83 241 72"/>
        <ellipse class="g-soft" cx="34" cy="168" rx="7" ry="86" fill="rgba(255,255,255,.55)" transform="rotate(5 34 168)"/>
        <ellipse class="g-soft" cx="128" cy="132" rx="72" ry="13" fill="rgba(255,255,255,.4)"/>
        <ellipse class="g-soft" cx="192" cy="116" rx="22" ry="9" fill="rgba(255,255,255,.36)"/>
        <ellipse class="g-soft" cx="118" cy="190" rx="64" ry="30" fill="rgba(120,108,160,.12)"/>
        <path class="g-line" style="opacity:.55" d="M44 272 Q47 296 70 296 L190 296 Q213 296 216 272"/>
      </svg>

      <button class="fab" id="fab" type="button" aria-label="Open note" aria-expanded="false" aria-controls="card">
        <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M17 6v22M6 17h22"/></svg>
      </button>
    </div>

    <p class="pill status" id="status" aria-live="polite">Write down what's on your mind, then throw it away.</p>
    <p class="pill tally" id="tally"></p>
  </section>
</main>

<div class="card" id="card" role="dialog" aria-label="Note" inert>
  <textarea class="note" id="note" maxlength="1000" placeholder="Write down whatever is on your mind" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="enter"></textarea>
  <div class="card-foot">
    <small>Once thrown away, it can't be read again.</small>
    <button class="toss" id="toss" type="button" disabled>Throw away</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var KEY = 'thought-trash-count';
  var $ = function(s){ return document.querySelector(s); };
  var root = document.documentElement;
  var app = $('#app'), card = $('#card'), note = $('#note'), tossBtn = $('#toss'), fab = $('#fab');
  var status = $('#status'), tally = $('#tally'), bin = $('#bin'), pile = $('#pile'), mouth = $('#mouth'), backdrop = $('#backdrop');
  var parts = bin.querySelectorAll('.bpart');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MSG = ['Thrown away. You can let it go now.', 'Into the bin it goes.', 'A little lighter now.'];

  var count = 0, busy = false, isOpen = false;
  try { count = Math.max(0, parseInt(localStorage.getItem(KEY) || '0', 10) || 0); } catch (e) {}

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function save(){ try { localStorage.setItem(KEY, String(count)); } catch (e) {} }
  function renderTally(){ tally.textContent = count > 0 ? 'Thoughts thrown away: ' + count : ''; }
  function rng(seed){
    var a = seed >>> 0;
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function mkCanvas(w, h){ var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

  function fit(){
    var v = window.visualViewport; if (!v) return;
    root.style.setProperty('--vvh', v.height + 'px');
    root.style.setProperty('--vvt', v.offsetTop + 'px');
  }
  if (window.visualViewport){ visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
  fit();

  /* ================= 구겨진 종이 뭉치: 면마다 다른 법선으로 빛을 계산해 접힌 면과 주름을 만든다 ================= */
  function makeBall(S, tint, seed, ink){
    var R = rng(seed * 7919 + 3), cv = mkCanvas(S, S), c = cv.getContext('2d');
    var id = c.createImageData(S, S), d = id.data, cx = S / 2, cy = S / 2, rad = S * 0.45, i, x, y;
    function seeds(n, spread){
      var o = { x: [], y: [], nx: [], ny: [], n: n };
      for (var q = 0; q < n; q++){
        var a0 = R() * 6.2832, rr = Math.sqrt(R()) * rad * 1.08;
        o.x.push(cx + Math.cos(a0) * rr); o.y.push(cy + Math.sin(a0) * rr);
        o.nx.push((R() + R() + R() - 1.5) * spread); o.ny.push((R() + R() + R() - 1.5) * spread);
      }
      return o;
    }
    var big = seeds(15, 1.0), small = seeds(42, 0.55);        // 큰 접힌 면 + 잔주름
    var ph = [R() * 6.28, R() * 6.28, R() * 6.28];
    var Lx = -0.45, Ly = -0.6, Lz = 0.66;
    function field(o, x, y){
      var d1 = 1e9, d2 = 1e9, i1 = 0, q;
      for (q = 0; q < o.n; q++){
        var ex = x - o.x[q], ey = y - o.y[q], dd = ex * ex + ey * ey;
        if (dd < d1){ d2 = d1; d1 = dd; i1 = q; } else if (dd < d2){ d2 = dd; }
      }
      d1 = Math.sqrt(d1); d2 = Math.sqrt(d2);
      var l = Math.sqrt(o.nx[i1] * o.nx[i1] + o.ny[i1] * o.ny[i1] + 1);
      return { s: (o.nx[i1] * Lx + o.ny[i1] * Ly + Lz) / l - 0.62, e: d2 - d1 };
    }
    for (y = 0; y < S; y++){
      for (x = 0; x < S; x++){
        var dx = x - cx, dy = y - cy, dist = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx);
        var edgeR = rad * (1 + 0.05 * Math.sin(3 * ang + ph[0]) + 0.04 * Math.sin(5 * ang + ph[1]) + 0.03 * Math.sin(9 * ang + ph[2]));
        var al = clamp((edgeR - dist) / 1.6, 0, 1);
        if (al <= 0) continue;
        var fb = field(big, x, y), fs = field(small, x, y);
        var s = fb.s * 1.0 + fs.s * 0.45 - ((dx * Lx + dy * Ly) / rad) * 0.16;
        var cb = fb.e < 1.8 ? 1 - fb.e / 1.8 : 0, cs = fs.e < 1.2 ? 1 - fs.e / 1.2 : 0;
        var crease = Math.max(cb * 0.9, cs * 0.45);
        var rim = clamp((dist - rad * 0.8) / (rad * 0.2), 0, 1);
        var k = (y * S + x) * 4;
        for (var ch = 0; ch < 3; ch++){
          var v = tint[ch];
          v = s < 0 ? v * (1 + s * 0.45) : v + (255 - v) * s * 0.6;
          v *= 1 - 0.2 * crease; v *= 1 - 0.1 * rim;
          d[k + ch] = clamp(v + (R() - 0.5) * 6, 0, 255);
        }
        d[k + 3] = al * 255;
      }
    }
    c.putImageData(id, 0, 0);
    if (ink){                                     // 신문이나 잡지처럼 보이는 잉크 자국
      c.globalCompositeOperation = 'source-atop';
      for (i = 0; i < 26; i++){
        c.fillStyle = 'rgba(40,40,56,' + (0.1 + R() * 0.18) + ')';
        c.save(); c.translate(R() * S, R() * S); c.rotate((R() - 0.5) * 1.2); c.fillRect(0, 0, S * (0.08 + R() * 0.2), 1.4 + R() * 1.2); c.restore();
      }
      c.fillStyle = 'rgba(' + (R() < .5 ? '255,120,60' : '60,150,255') + ',.3)'; c.fillRect(S * 0.3, S * 0.28, S * 0.22, S * 0.16);
    }
    return cv;
  }

  /* ================= 평평한 종이에 생기는 접힌 자국(창작 접힘 레이어) ================= */
  function makeFolds(w, h, seed){
    var sc = 0.5, W = Math.round(w * sc), H = Math.round(h * sc), R = rng(seed * 131 + 7);
    var cv = mkCanvas(W, H), c = cv.getContext('2d'), id = c.createImageData(W, H), d = id.data, NL = 9, lines = [], i, x, y;
    for (i = 0; i < NL; i++){                           // 종이를 가로지르는 접힌 선(직선)
      var ang = R() * Math.PI, px = W * (0.1 + R() * 0.8), py = H * (0.1 + R() * 0.8);
      lines.push({ px: px, py: py, nx: Math.cos(ang), ny: Math.sin(ang), x0: (R() - 0.2) * 0.4, x1: 0.6 + R() * 0.4 });
    }
    function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
    for (y = 0; y < H; y++){
      for (x = 0; x < W; x++){
        var mask = 0, minD = 1e9;
        for (i = 0; i < NL; i++){
          var L = lines[i], dd = L.nx * (x - L.px) + L.ny * (y - L.py);
          if (dd > 0) mask |= (1 << i);
          var ad = Math.abs(dd); if (ad < minD) minD = ad;
        }
        var tilt = hash(mask * 2654435761 + seed) * 2 - 1;
        var k = (y * W + x) * 4, a, rr, gg, bb;
        var crease = minD < 1.3 ? 1 - minD / 1.3 : 0;
        if (crease > 0 && hash(mask + 77) > 0.12){ rr = 66; gg = 58; bb = 50; a = crease * 0.4; }
        else if (tilt < 0){ rr = 74; gg = 66; bb = 58; a = -tilt * 0.3; }
        else { rr = 255; gg = 255; bb = 255; a = tilt * 0.3; }
        d[k] = rr; d[k + 1] = gg; d[k + 2] = bb; d[k + 3] = clamp(a, 0, 1) * 255;
      }
    }
    c.putImageData(id, 0, 0);
    return cv;
  }

  /* ================= 통 안의 종이 더미 ================= */
  var DECOR = [[130,72,66,[236,230,214],true,1],[78,76,58,[247,190,205],false,2],[182,76,58,[196,226,255],true,3],[46,84,40,[255,232,160],false,4],[214,84,40,[190,232,210],false,5]];
  var POS = [[100,48,62],[160,48,62],[130,26,64],[64,56,50],[198,56,50],[102,10,52],[158,10,52],[130,-8,50],[56,30,42],[206,30,42]];
  var CREAM = [250, 247, 240];
  function mk(tag, attrs){ var el = document.createElementNS(NS, tag); for (var k in attrs) el.setAttribute(k, attrs[k]); return el; }
  function addBallImage(href, x, y, dsize, rot, shown){
    var g = mk('g', { transform: 'translate(' + x + ' ' + y + ') rotate(' + rot + ')' });
    g.style.opacity = shown ? '1' : '0';
    var im = mk('image', { x: -dsize / 2, y: -dsize / 2, width: dsize, height: dsize });
    im.setAttribute('href', href);
    g.appendChild(im); pile.appendChild(g);
    return g;
  }
  var ballCache = {};
  function ballUrl(seed, tint, ink){
    var key = seed + ':' + tint.join(',');
    if (!ballCache[key]) ballCache[key] = makeBall(160, tint, seed, ink).toDataURL('image/png');
    return ballCache[key];
  }
  DECOR.forEach(function(dd){ addBallImage(ballUrl(dd[5] + 10, dd[3], dd[4]), dd[0], dd[1], dd[2], (dd[5] * 53) % 360, true); });
  for (var bi = 0; bi < Math.min(count, POS.length); bi++){
    addBallImage(ballUrl(bi + 50, CREAM, false), POS[bi][0], POS[bi][1], POS[bi][2], (bi * 47) % 360, true);
  }
  renderTally();

  /* ================= 실제 종이: 윗면을 손으로 찢은 가장자리, 섬유, 결, 음영 ================= */
  var pw = 0, ph = 0;
  function jitterPoly(W, H, m, ampTop, amp, step, R){
    var pts = [], x, y;
    for (x = m; x < W - m; x += step) pts.push([x, m + R() * ampTop]);
    for (y = m; y < H - m; y += step) pts.push([W - m - R() * amp, y]);
    for (x = W - m; x > m; x -= step) pts.push([x, H - m - R() * amp]);
    for (y = H - m; y > m; y -= step) pts.push([m + R() * amp, y]);
    return pts;
  }
  function drawPoly(c, pts){ c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (var k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]); c.closePath(); }
  function noiseAndFibers(c, W, H, R, dpr, fiberDensity){
    var i, nf = Math.round(W * H / fiberDensity);
    c.lineCap = 'round';
    for (i = 0; i < nf; i++){
      var x = R() * W, y = R() * H, len = (3 + R() * 11) * dpr, a = R() * Math.PI, bend = (R() - 0.5) * len * 0.7, al = 0.05 + R() * 0.08;
      c.strokeStyle = R() < 0.55 ? 'rgba(112,96,72,' + al + ')' : 'rgba(255,255,255,' + (al * 1.6) + ')';
      c.lineWidth = (0.4 + R() * 0.5) * dpr;
      c.beginPath(); c.moveTo(x, y);
      c.quadraticCurveTo(x + Math.cos(a) * len * 0.5 - Math.sin(a) * bend, y + Math.sin(a) * len * 0.5 + Math.cos(a) * bend, x + Math.cos(a) * len, y + Math.sin(a) * len);
      c.stroke();
    }
    var id = c.getImageData(0, 0, W, H), dd = id.data;
    for (i = 0; i < dd.length; i += 4){ var nz = (R() - 0.5) * 10; dd[i] += nz; dd[i + 1] += nz; dd[i + 2] += nz * 0.9; }
    c.putImageData(id, 0, 0);
  }
  function makePaper(){
    var cw = card.offsetWidth, ch = card.offsetHeight;
    if (!cw || !ch || (Math.abs(cw - pw) < 2 && Math.abs(ch - ph) < 2)) return;
    pw = cw; ph = ch;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5), W = Math.round(cw * dpr), H = Math.round(ch * dpr);
    var cv = mkCanvas(W, H), c = cv.getContext('2d'), R = rng(4242 + cw * 7 + ch), i;
    var m = 3 * dpr;
    var outer = jitterPoly(W, H, m, 11 * dpr, 1.2 * dpr, 6 * dpr, R);            // 찢겨 일어난 하얀 섬유 가장자리
    var inner = jitterPoly(W, H, m + 3.5 * dpr, 8 * dpr, 0.8 * dpr, 6 * dpr, R);
    drawPoly(c, outer); c.fillStyle = '#FBF8F1'; c.fill();
    c.save(); drawPoly(c, outer); c.clip();
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FCFAF4'); g.addColorStop(1, '#F2EEE2');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (i = 0; i < 30; i++){
      var sx = R() * W, sy = R() * H, sr = (40 + R() * 120) * dpr, sg = c.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, R() < 0.6 ? 'rgba(150,128,92,' + (0.025 + R() * 0.03) + ')' : 'rgba(255,255,255,' + (0.18 + R() * 0.15) + ')'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sg; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
    noiseAndFibers(c, W, H, R, dpr, 650);
    drawPoly(c, inner); c.strokeStyle = 'rgba(150,126,90,.2)'; c.lineWidth = 1.6 * dpr; c.stroke();     // 찢은 선 안쪽의 미세한 음영
    for (i = 0; i < 5; i++){ c.strokeStyle = 'rgba(120,96,60,' + (0.03 - i * 0.005) + ')'; c.lineWidth = (5 - i) * 2 * dpr; c.strokeRect(0, 0, W, H); }
    c.restore();
    try {
      root.style.setProperty('--paper-img', 'url(' + cv.toDataURL('image/png') + ')');
      root.style.setProperty('--crease-img', 'url(' + makeFolds(cw, ch, 5).toDataURL('image/png') + ')');
    } catch (e) {}
  }
  makePaper();
  window.addEventListener('resize', makePaper);

  /* ================= 메모 열기/닫기 ================= */
  function openCard(){
    if (busy || isOpen) return;
    isOpen = true; makePaper();
    card.inert = false; card.classList.add('open');
    fab.classList.add('is-open'); fab.setAttribute('aria-label', 'Close note'); fab.setAttribute('aria-expanded', 'true');
    app.classList.add('open');
    note.focus({ preventScroll: true });
  }
  function closeCard(){
    if (!isOpen) return;
    isOpen = false; note.blur();
    card.classList.remove('open'); card.inert = true;
    fab.classList.remove('is-open'); fab.setAttribute('aria-label', 'Open note'); fab.setAttribute('aria-expanded', 'false');
    app.classList.remove('open');
  }
  fab.addEventListener('click', function(){ if (busy) return; isOpen ? closeCard() : openCard(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !busy) closeCard(); });
  note.addEventListener('input', function(){ tossBtn.disabled = !note.value.trim(); });

  function bounce(){
    if (reduce) return;
    for (var i = 0; i < parts.length; i++){
      parts[i].animate([{ transform: 'none' }, { transform: 'translateY(4px) scale(1.02,.98)' }, { transform: 'none' }], { duration: 360, easing: 'ease-out' });
    }
  }

  /* ================= 구겨서 던지기 ================= */
  function polyRect(w, h){
    var p = [], i, n = 5;
    for (i = 0; i < n; i++) p.push([w * i / n, 0]);
    for (i = 0; i < n; i++) p.push([w, h * i / n]);
    for (i = 0; i < n; i++) p.push([w - w * i / n, h]);
    for (i = 0; i < n; i++) p.push([0, h - h * i / n]);
    return p;
  }
  function polyCrumple(w, h, amt){
    var cx = w / 2, cy = h / 2, s = Math.min(w, h);
    return polyRect(w, h).map(function(q){
      var k = amt * s * (0.3 + Math.random() * 0.9), dx = cx - q[0], dy = cy - q[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
      return [q[0] + dx / d * k + (Math.random() - 0.5) * amt * s * 0.28, q[1] + dy / d * k + (Math.random() - 0.5) * amt * s * 0.28];
    });
  }
  function polyBall(w, h, rad){
    var p = [];
    for (var k = 0; k < 20; k++){
      var a = Math.PI * 2 * k / 20 + (Math.random() - 0.5) * 0.14, rr2 = rad * (0.9 + Math.random() * 0.14);
      p.push([w / 2 + Math.cos(a) * rr2, h / 2 + Math.sin(a) * rr2]);
    }
    return p;
  }
  function css(p){ return 'polygon(' + p.map(function(q){ return q[0].toFixed(1) + 'px ' + q[1].toFixed(1) + 'px'; }).join(',') + ')'; }

  async function toss(){
    var text = note.value.trim();
    if (!text || busy) return;
    busy = true; tossBtn.disabled = true; fab.disabled = true;

    var v = window.visualViewport;
    var kb = v && (window.innerHeight - v.height > 100);
    note.blur();
    if (kb) await wait(340);
    fit();

    var r = card.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight;
    var idx = count, hasSlot = idx < POS.length;
    var url = ballUrl(idx + 50, CREAM, false);
    var ball = hasSlot ? addBallImage(url, POS[idx][0], POS[idx][1], POS[idx][2], (idx * 47) % 360, false) : null;
    var tr = (ball ? ball.firstChild : mouth).getBoundingClientRect();
    var tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
    var dx = tx - (r.left + r.width / 2), dy = ty - (r.top + r.height / 2);
    var R2 = Math.min(w, h) * 0.42;
    var ballSize = 2 * R2 / 0.9;                                        // 공 이미지는 지름의 90%가 종이 뭉치
    var sA = 96 / (R2 * 2);
    var sT = (ball ? tr.width : 34) / ballSize;
    var apex = Math.min(130, Math.abs(dy) * 0.3 + 44);

    var wrap = document.createElement('div');
    wrap.className = 'paper';
    wrap.style.left = r.left + 'px'; wrap.style.top = r.top + 'px'; wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
    wrap.innerHTML = '<div class="sheet"><div class="ptxt"></div><div class="fold"></div></div><div class="ballimg"></div>';
    var sheet = wrap.firstChild, txt = sheet.firstChild, fold = txt.nextSibling, bimg = sheet.nextSibling;
    txt.textContent = text;
    bimg.style.cssText = 'width:' + ballSize + 'px;height:' + ballSize + 'px;left:' + ((w - ballSize) / 2) + 'px;top:' + ((h - ballSize) / 2) + 'px;background-image:url(' + url + ')';
    bin.appendChild(wrap);

    card.classList.add('snap'); closeCard(); note.value = '';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ card.classList.remove('snap'); }); });

    try {
      if (reduce){
        await wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }).finished;
      } else {
        var T = 2000, bp = polyBall(w, h, R2);
        sheet.animate([
          { clipPath: css(polyRect(w, h)), opacity: 1, offset: 0 },
          { clipPath: css(polyCrumple(w, h, 0.05)), opacity: 1, offset: 0.08 },
          { clipPath: css(polyCrumple(w, h, 0.14)), opacity: 1, offset: 0.15 },
          { clipPath: css(polyCrumple(w, h, 0.24)), opacity: 1, offset: 0.22 },
          { clipPath: css(bp), opacity: 1, offset: 0.29 },
          { clipPath: css(bp), opacity: 0, offset: 0.34 },
          { clipPath: css(bp), opacity: 0, offset: 1 }
        ], { duration: T, fill: 'forwards' });
        txt.animate([{ opacity: 1, offset: 0 }, { opacity: 1, offset: 0.04 }, { opacity: 0, offset: 0.16 }, { opacity: 0, offset: 1 }], { duration: T, fill: 'forwards' });
        fold.animate([{ opacity: 0, offset: 0.02 }, { opacity: 0.55, offset: 0.1 }, { opacity: 1, offset: 0.22 }, { opacity: 1, offset: 1 }], { duration: T, fill: 'forwards' });
        bimg.animate([{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.22 }, { opacity: 1, offset: 0.32 }, { opacity: 1, offset: 1 }], { duration: T, fill: 'forwards' });
        var flight = wrap.animate([
          { transform: 'translate(0,0) scale(1) rotate(-.6deg)', opacity: 1, offset: 0, easing: 'ease-in' },
          { transform: 'translate(0,0) scale(' + (sA * 2.2) + ') rotate(5deg)', opacity: 1, offset: 0.17, easing: 'ease-out' },
          { transform: 'translate(0,-6px) scale(' + sA + ') rotate(-14deg)', opacity: 1, offset: 0.3, easing: 'cubic-bezier(.3,.1,.5,1)' },
          { transform: 'translate(' + (dx * 0.5) + 'px,' + (dy * 0.25 - apex) + 'px) scale(' + (sA * 0.78) + ') rotate(-210deg)', opacity: 1, offset: 0.58, easing: 'cubic-bezier(.5,0,.9,.7)' },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sT + ') rotate(-400deg)', opacity: 1, offset: 0.88 },
          { transform: 'translate(' + dx + 'px,' + (dy + 3) + 'px) scale(' + (sT * 0.92) + ') rotate(-410deg)', opacity: 0, offset: 1 }
        ], { duration: T, fill: 'forwards' });
        await flight.finished;
      }
    } catch (e) {}

    if (ball) ball.style.opacity = '1';
    wrap.remove();
    bounce();
    status.textContent = MSG[count % MSG.length];
    count += 1; save(); renderTally();
    fab.disabled = false; busy = false;
  }
  tossBtn.addEventListener('click', toss);
})();
</script>
